<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Register - Online Voting System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { padding: 30px; background: #ecf0f1; font-family: 'Segoe UI', Tahoma, sans-serif; }
        h2 { color: #2c3e50; margin-bottom: 15px; }
        p { color: #34495e; margin-bottom: 12px; }
        label { display: block; margin-bottom: 12px; color: #34495e; font-weight: 500; }
        input[type="text"] { padding: 10px 12px; width: 100%; max-width: 300px; border: 1px solid #bdc3c7; border-radius: 6px; }
        input[type="submit"] { padding: 10px 24px; background: #27ae60; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; margin-top: 8px; }
    </style>
</head>
<body>
    <h2>Register as Voter</h2>
    <p>New voters can register here. Provide valid ID and constituency details.</p>
    <form action="#" method="post">
        <label>Name: <input type="text" name="name"></label>
        <label>Voter ID: <input type="text" name="voterid"></label>
        <p><input type="submit" value="Register"></p>
    </form>
</body>
</html>
