<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Results - Online Voting System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { padding: 25px; background: #f8f9fa; font-family: 'Segoe UI', Tahoma, sans-serif; }
        h2 { color: #2c3e50; margin-bottom: 15px; }
        img { border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); margin-bottom: 15px; }
        p { color: #34495e; margin-bottom: 15px; }
        table { border-collapse: collapse; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        th { background: linear-gradient(135deg, #8e44ad, #9b59b6); color: white; padding: 12px 16px; text-align: left; }
        td { padding: 10px 16px; background: white; border-bottom: 1px solid #ecf0f1; }
    </style>
</head>
<body>
    <h2>Election Results</h2>
    <img src="https://via.placeholder.com/200x100/9b59b6/ffffff?text=Results" alt="Results" width="200" height="100">
    <p>View live and final election results here. All results are verified and transparent.</p>
    <table border="1" cellpadding="5">
        <tr><th>Election</th><th>Status</th></tr>
        <tr><td>National 2024</td><td>Completed</td></tr>
        <tr><td>Local 2024</td><td>In Progress</td></tr>
    </table>
</body>
</html>
