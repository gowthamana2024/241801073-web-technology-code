<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Navigation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            padding: 20px 15px; 
            background: #2c3e50;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            min-height: 100%;
        }
        h3 { 
            color: #ecf0f1; 
            font-size: 1em; 
            margin-bottom: 15px; 
            padding-bottom: 10px;
            border-bottom: 2px solid #3498db;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        a { 
            display: block; 
            padding: 12px 14px; 
            margin: 8px 0;
            color: #ecf0f1; 
            text-decoration: none;
            border-radius: 6px;
            transition: all 0.2s;
        }
        a:hover { 
            background: #3498db; 
            color: white;
        }
    </style>
</head>
<body>

    <a href="login.html" target="rightFrame">Login</a>
    <a href="catalogue.html" target="rightFrame">Catalogue</a>

</body>
</html>
