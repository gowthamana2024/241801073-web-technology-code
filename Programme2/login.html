<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login - Online Voting System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { padding: 30px; background: #ecf0f1; font-family: 'Segoe UI', Tahoma, sans-serif; }
        h2 { color: #2c3e50; margin-bottom: 20px; }
        form { max-width: 320px; }
        label { display: block; margin-bottom: 15px; color: #34495e; font-weight: 500; }
        input[type="text"], input[type="password"] { 
            width: 100%; padding: 10px 12px; margin-top: 5px;
            border: 1px solid #bdc3c7; border-radius: 6px;
        }
        input[type="submit"] { 
            padding: 10px 24px; background: #27ae60; color: white; border: none; 
            border-radius: 6px; cursor: pointer; font-weight: 600; margin-right: 8px;
        }
        input[type="reset"] { 
            padding: 10px 24px; background: #95a5a6; color: white; border: none; 
            border-radius: 6px; cursor: pointer;
        }
        a { color: #3498db; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h2>Voter Login</h2>
    <form action="#" method="post">
        <label>Voter ID: <input type="text" name="voterid"></label>
        <label>Password: <input type="password" name="password"></label>
        <p><input type="submit" value="Login"> <input type="reset" value="Reset"></p>
    </form>
    <p style="margin-top: 15px;">Don't have an account? <a href="register.html" target="rightFrame">Register here</a></p>
</body>
</html>
