<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Catalogue - Online Voting System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { padding: 30px; background: #ecf0f1; font-family: 'Segoe UI', Tahoma, sans-serif; }
        h2 { color: #2c3e50; margin-bottom: 20px; }
        table { 
            border-collapse: collapse; 
            width: 100%; 
            max-width: 700px;
            border-radius: 8px; 
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        th { 
            background: linear-gradient(135deg, #1a5276, #2980b9); 
            color: white; 
            padding: 14px 16px; 
            text-align: left;
        }
        td { padding: 12px 16px; background: white; border-bottom: 1px solid #ecf0f1; }
        tr:nth-child(even) td { background: #f8f9fa; }
        tr:hover td { background: #e8f4f8; }
    </style>
</head>
<body>
    <h2>Election Candidates Catalogue</h2>
    <table border="1" cellpadding="8" cellspacing="0">
        <tr>
            <th>ID</th>
            <th>Candidate Name</th>
            <th>Party</th>
            <th>Constituency</th>
        </tr>
        <tr>
            <td>001</td>
            <td>John Smith</td>
            <td>Democratic Party</td>
            <td>North District</td>
        </tr>
        <tr>
            <td>002</td>
            <td>Jane Doe</td>
            <td>National Alliance</td>
            <td>South District</td>
        </tr>
        <tr>
            <td>003</td>
            <td>Robert Wilson</td>
            <td>Unity Party</td>
            <td>East District</td>
        </tr>
        <tr>
            <td>004</td>
            <td>Sarah Johnson</td>
            <td>Democratic Party</td>
            <td>West District</td>
        </tr>
    </table>
</body>
</html>
