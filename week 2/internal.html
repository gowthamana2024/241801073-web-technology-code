<!DOCTYPE html>
<html>
<head>
    <title>Online Voting - Internal CSS</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f4f4f4;
            text-align: center;
        }

        h1 {
            color: darkred;
        }

        p {
            font-size: 18px;
            color: navy;
        }

        input {
            padding: 8px;
            margin: 5px;
        }

        button {
            background-color: green;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
        }
    </style>

</head>
<body>

    <h1>Voter Login</h1>

    <p>Please enter your credentials to continue.</p>

    <input type="text" placeholder="Voter ID"><br>
    <input type="password" placeholder="Password"><br><br>

    <button>Login</button>

</body>
</html>
